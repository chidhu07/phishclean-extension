<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test: Password Field Detection</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    .info { background: #e3f2fd; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    form { background: #f5f5f5; padding: 20px; border-radius: 8px; }
    input { display: block; margin: 10px 0; padding: 8px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Password Field Detection Test</h1>
  <div class="info">
    <strong>Expected:</strong> Extension should detect PASSWORD_FIELD signal (score +20).
    This page has a simple login form with a password input.
  </div>
  <!-- POST so credentials are NOT placed in the URL — keeps this a true
       negative test (password field alone scores 20, below the 40 threshold). -->
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" placeholder="Enter username">
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password">
    <button type="submit">Log In</button>
  </form>
</body>
</html>
