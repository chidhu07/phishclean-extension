<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Browser not supported - Example Bank</title></head>
<body style="font-family:sans-serif;max-width:560px;margin:60px auto">
  <!-- A real "unsupported browser" notice: it points to the browser makers'
       own sites. It must not warn. -->
  <h1>Your browser is out of date</h1>
  <p>Online banking needs a current browser. Update your browser to continue.</p>
  <ul>
    <li><a href="https://www.google.com/chrome/">Update Chrome</a></li>
    <li><a href="https://www.mozilla.org/firefox/new/">Update Firefox</a></li>
    <li><a href="https://www.microsoft.com/edge">Update Edge</a></li>
  </ul>
</body>
</html>
