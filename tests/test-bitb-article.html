<html lang="en"><head><meta charset="utf-8"><title>What is a browser-in-the-browser attack?</title>
<style> body { font-family: Georgia, serif; max-width: 680px; margin: 40px auto; line-height: 1.6; } figure { border: 1px solid #ccc; padding: 16px; } </style></head>
<body>
  <h1>What is a browser-in-the-browser attack?</h1>
  <p>A browser-in-the-browser attack draws a fake popup inside the page. The fake address bar might read https://accounts.google.com even though you never left the attacker's site.</p>
  <figure>
    <p>Example of what the fake window shows: https://login.microsoftonline.com/common/oauth2/authorize</p>
    <figcaption>The real popup would be a separate window you can drag outside the page.</figcaption>
  </figure>
